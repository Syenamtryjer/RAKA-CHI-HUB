<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAKA-CHI Calculate</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .glass-panel { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { brand: { 50: '#eff6ff', 100: '#dbeafe', 200: '#bfdbfe', 300: '#93c5fd', 400: '#60a5fa', 500: '#3b82f6', 600: '#2563eb', 900: '#1e3a8a' } } } }
        }
    </script>
</head>
<body class="text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        const USERS_API = "https://script.google.com/macros/s/AKfycbx-kbTycK41gjA9-HWw97U9WULXJNf2xKGN7UrnOrkS_ZHyJ14D4C782v5bVWpWhAfTYw/exec";
        const DRAFTS_API = "https://script.google.com/macros/s/AKfycbyEE8__0kR7UIgYgWQQhusBNNCY13AeDMyYoBqjzzB2tpAWxOkIAmxOyvu9Pu9zEwhm0w/exec";
        
        const COMP_CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSKlVjA-oHs95wFhQSRwSW4roQA3Ilo67VTT0hDNDnkTDlba4LU5UAKb2F8i_a9IX1q0LJhgFNN9pZF/pub?gid=0&single=true&output=csv";
        const FIL_CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSKlVjA-oHs95wFhQSRwSW4roQA3Ilo67VTT0hDNDnkTDlba4LU5UAKb2F8i_a9IX1q0LJhgFNN9pZF/pub?gid=1295243501&single=true&output=csv";
        const USERS_CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSKlVjA-oHs95wFhQSRwSW4roQA3Ilo67VTT0hDNDnkTDlba4LU5UAKb2F8i_a9IX1q0LJhgFNN9pZF/pub?gid=474170626&single=true&output=csv";
        const DRAFTS_CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSKlVjA-oHs95wFhQSRwSW4roQA3Ilo67VTT0hDNDnkTDlba4LU5UAKb2F8i_a9IX1q0LJhgFNN9pZF/pub?gid=205737292&single=true&output=csv";

        const cleanNum = (val) => {
            if (val === undefined || val === null || val === '') return 0;
            if (typeof val === 'number') return val;
            let clean = String(val).replace(/RM|\s|,|[a-zA-Z]/gi, ''); 
            let num = parseFloat(clean);
            return isNaN(num) ? 0 : num;
        };

        const formatForSheet = (val) => val ? String(val).replace(/ /g, '_') : '';
        const formatForDisplay = (val) => val ? String(val).replace(/_/g, ' ') : '';
        const cleanHeader = (val) => val.trim().toUpperCase().replace(/[^A-Z0-9]/g, '');

        const parseCSV = (csv) => {
            const lines = csv.split(/\r?\n/);
            if (lines.length < 2) return [];
            
            const headers = lines[0].split(',').map(h => cleanHeader(h));
            const data = [];
            
            for (let i = 1; i < lines.length; i++) {
                const line = lines[i];
                if (!line.trim()) continue;
                let cols = [];
                let inQuotes = false;
                let col = '';
                for (let j = 0; j < line.length; j++) {
                    const c = line[j];
                    if (c === '"') inQuotes = !inQuotes;
                    else if (c === ',' && !inQuotes) { cols.push(col); col = ''; }
                    else col += c;
                }
                cols.push(col);
                
                let rowObj = {};
                headers.forEach((h, idx) => {
                    rowObj[h] = cols[idx] ? cols[idx].trim().replace(/^"|"$/g, '') : '';
                });
                data.push(rowObj);
            }
            return data;
        };

        const processFilaments = (rawData) => {
            const grouped = [];
            rawData.forEach(row => {
                const type = row.MATERIALTYPE || row.FAMILY || "";
                const variant = row.VARIANT || "";
                const brand = row.BRAND || "";
                const price = cleanNum(row.PRICERM || row.PRICE);
                const color = row.COLOURWEIGHTG || row.COLOUR || "";
                
                if (!type && !brand) return;
                
                const monoNoSup = cleanNum(row.MONOCHROMEWITHOUTSUPPORTRM);
                const monoSup = cleanNum(row.MONOCHROMEWITHSUPPORTRM);
                const multiNoSup = cleanNum(row.MULTICOLOURWITHOUTSUPPORTRM);
                const multiSup = cleanNum(row.MULTICOLOURWITHSUPPORTRM);
                const overheadHour = cleanNum(row.OVERHEADHOURRM);
                const overheadMin = cleanNum(row.OVERHEADMINRM);
                
                const existing = grouped.find(g => g.type === type && g.variant === variant && g.brand === brand && g.price === price);
                
                if (existing) {
                    if (color && !existing.colors.includes(color)) existing.colors.push(color);
                } else {
                    grouped.push({
                        id: grouped.length, type, variant, brand, price,
                        colors: color ? [color] : [],
                        monoNoSup, monoSup, multiNoSup, multiSup,
                        overheadHour, overheadMin
                    });
                }
            });
            return grouped.map(g => ({ ...g, colour: g.colors.join(', ') }));
        };

        const processComponents = (rawData) => {
            return rawData.map((row, idx) => ({
                id: idx,
                category: (row.CATEGORY || "").toUpperCase(),
                name: row.COMPONENTNAME || row.NAME || "",
                price: cleanNum(row.SALEPRICEUNITRM || row.SALEPRICE || 0)
            })).filter(c => c.name);
        };

        function App() {
            const [toast, setToast] = React.useState(null);
            const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(null), 3000); };

            const [user, setUser] = React.useState(null); 
            const [authScreenMode, setAuthScreenMode] = React.useState('login'); 
            const [authLoading, setAuthLoading] = React.useState(false);
            const [otp, setOtp] = React.useState(['', '', '', '', '', '']);
            const otpRefs = React.useRef(new Array(6).fill(null));
            const [tempUserId, setTempUserId] = React.useState(null);
            
            const [showProfileModal, setShowProfileModal] = React.useState(false);
            const [showGuestAlert, setShowGuestAlert] = React.useState(false);

            const [userDrafts, setUserDrafts] = React.useState([]);
            const [loadingDrafts, setLoadingDrafts] = React.useState(false);
            const [selectedDraft, setSelectedDraft] = React.useState(null);

            const [loginPhone, setLoginPhone] = React.useState('');
            const [loginPassword, setLoginPassword] = React.useState('');
            
            const [signupForm, setSignupForm] = React.useState({
                fullName: '', nickname: '', gender: '', monthOfBirth: 'January', ageStages: 'Dewasa (Adult): 26 hingga 39 tahun', whatsappNo: '', password: ''
            });

            const [step, setStep] = React.useState(1);
            const [db, setDb] = React.useState({ filaments: [], components: [] });
            const [loadingDb, setLoadingDb] = React.useState(true);
            const [refreshingDb, setRefreshingDb] = React.useState(false);

            const [productName, setProductName] = React.useState("");
            const [parts, setParts] = React.useState([]);
            const [plates, setPlates] = React.useState([]);
            const [selectedComponents, setSelectedComponents] = React.useState([]);
            const [orderQty, setOrderQty] = React.useState(1);
            const [savingDraft, setSavingDraft] = React.useState(false);

            const renderMultiline = (str) => {
                if (!str || str.trim() === '') return "-";
                const items = str.split(', ');
                return items.map((item, idx) => (
                    <span key={idx} className="block pb-1">
                        {formatForDisplay(item)}{idx < items.length - 1 ? ',' : ''}
                    </span>
                ));
            };

            const fetchGoogleData = async () => {
                const ts = Date.now();
                try {
                    const [resComp, resFil] = await Promise.all([
                        fetch(`${COMP_CSV}&t=${ts}`),
                        fetch(`${FIL_CSV}&t=${ts}`)
                    ]);
                    const txtComp = await resComp.text();
                    const txtFil = await resFil.text();

                    setDb({
                        components: processComponents(parseCSV(txtComp)),
                        filaments: processFilaments(parseCSV(txtFil))
                    });
                } catch (e) {
                    showToast("Failed to sync database.");
                }
            };

            const fetchDrafts = async () => {
                if (!user || user === 'GUEST') return;
                setLoadingDrafts(true);
                try {
                    const ts = Date.now();
                    const res = await fetch(`${DRAFTS_CSV}&t=${ts}`);
                    const csv = await res.text();
                    const data = parseCSV(csv);
                    const myDrafts = data.filter(r => r.USERID === user.userId).reverse();
                    setUserDrafts(myDrafts);
                } catch (e) {
                    showToast("Failed to fetch drafts.");
                }
                setLoadingDrafts(false);
            };

            React.useEffect(() => {
                fetchGoogleData().finally(() => setLoadingDb(false));
            }, []);

            React.useEffect(() => {
                if (showProfileModal) fetchDrafts();
            }, [showProfileModal]);

            const handleRefresh = async () => {
                setRefreshingDb(true);
                await fetchGoogleData();
                setRefreshingDb(false);
            };

            const calculatedPlates = React.useMemo(() => {
                return plates.map(plate => {
                    let totalWeight = 0;
                    let materialCost = 0;
                    let isPlateMulti = false;
                    let isPlateSupport = false;
                    let maxOvHour = 0;
                    let maxOvMin = 0;
                    
                    plate.parts.forEach(pRef => {
                        if (pRef.qty > 0) {
                            const partObj = parts.find(p => p.id === pRef.partId);
                            if (partObj) {
                                if (partObj.selectedColors && partObj.selectedColors.length > 1) isPlateMulti = true;
                                if (partObj.support) isPlateSupport = true;
                                
                                const filament = db.filaments[partObj.filamentIndex];
                                if (filament) {
                                    if (filament.overheadHour > maxOvHour) maxOvHour = filament.overheadHour;
                                    if (filament.overheadMin > maxOvMin) maxOvMin = filament.overheadMin;
                                }
                            }
                        }
                    });
                    
                    const timeFee = (parseInt(plate.hours || 0) * maxOvHour) + (parseInt(plate.minutes || 0) * maxOvMin);
                    
                    const detailedParts = plate.parts.map(pRef => {
                        const partObj = parts.find(p => p.id === pRef.partId);
                        if (partObj) {
                            const partWeight = parseFloat(partObj.weight) || 0;
                            totalWeight += (partWeight * pRef.qty);
                            
                            const filament = db.filaments[partObj.filamentIndex] || db.filaments[0];
                            let rate = 0;
                            
                            if (filament) {
                                if (isPlateMulti && isPlateSupport) rate = filament.multiSup;
                                else if (isPlateMulti && !isPlateSupport) rate = filament.multiNoSup;
                                else if (!isPlateMulti && isPlateSupport) rate = filament.monoSup;
                                else rate = filament.monoNoSup;
                                
                                materialCost += (partWeight * rate * pRef.qty);
                            }
                            return { ...pRef, name: partObj.name, weight: partWeight, rate };
                        }
                        return pRef;
                    });
                    
                    return { ...plate, totalWeight, materialCost, isPlateMulti, isPlateSupport, detailedParts, timeFee };
                });
            }, [plates, parts, db.filaments]);

            const totalPlatesCount = calculatedPlates.reduce((acc, pl) => acc + (parseInt(pl.qty) || 0), 0);
            const plateService = db.components.find(c => c.category === 'SERVICES' && c.name.toUpperCase().includes('PLATE')) || db.components.find(c => c.category === 'SERVICES');
            const plateFeeRate = plateService ? plateService.price : 0;
            const totalPlateFee = totalPlatesCount * plateFeeRate;
            const totalPrintTimeFee = calculatedPlates.reduce((acc, pl) => acc + (pl.timeFee * (parseInt(pl.qty) || 0)), 0);
            const plateMaterialTotal = calculatedPlates.reduce((acc, pl) => acc + (pl.materialCost * pl.qty), 0);
            const componentsTotal = selectedComponents.reduce((acc, c) => acc + ((c.qty || 1) * c.price), 0);
            const finalTotal = plateMaterialTotal + componentsTotal + totalPlateFee + totalPrintTimeFee; 

            const handlePhoneInput = (e, setVal) => {
                let val = e.target.value.replace(/\D/g, '');
                if (val.startsWith('0')) val = val.substring(1);
                else if (val.startsWith('60')) val = val.substring(2);
                setVal(val);
            };

            const handleLoginSubmit = async (e) => {
                e.preventDefault();
                setAuthLoading(true);
                try {
                    const ts = Date.now();
                    const res = await fetch(`${USERS_CSV}&t=${ts}`);
                    const csv = await res.text();
                    const data = parseCSV(csv);
                    
                    const cleanLoginPhone = loginPhone.replace(/\D/g, '');
                    
                    const userRow = data.find(r => {
                        let sheetPhoneRaw = String(r.WHATSAPPNO || r.WHATSAPP || "").replace(/\D/g, '');
                        if (sheetPhoneRaw.startsWith('60')) sheetPhoneRaw = sheetPhoneRaw.substring(2);
                        return sheetPhoneRaw === cleanLoginPhone && String(r.PASSWORD) === loginPassword;
                    });

                    if (userRow) {
                        setUser({ userId: userRow.USERID || "USR", nickname: userRow.NICKNAME || "User" });
                        showToast("Log In Successful!");
                    } else {
                        showToast("Phone number or password mismatch.");
                    }
                } catch (e) {
                    showToast("Error connecting to database.");
                }
                setAuthLoading(false);
            };

            const handleSignupSubmit = async (e) => {
                e.preventDefault();
                setAuthLoading(true);
                try {
                    const payload = { action: 'register', ...signupForm, whatsappNo: "+60" + signupForm.whatsappNo };
                    const res = await fetch(USERS_API, { method: 'POST', body: JSON.stringify(payload) });
                    const text = await res.text();
                    let data;
                    try { data = JSON.parse(text); } catch(err) { data = { status: 'success', message: text }; }

                    if (data.status === 'success' || text.includes('Berjaya') || text.includes('success')) {
                        setTempUserId(data.userId || "USR000");
                        setAuthScreenMode('otp');
                        showToast("Registration successful. Enter OTP.");
                    } else {
                        showToast("Error: " + (data.message || text));
                    }
                } catch (e) {
                    showToast("Failed to connect. Please try again.");
                }
                setAuthLoading(false);
            };

            const handleSaveQuotation = async () => {
                if (!user || user === 'GUEST') {
                    setShowGuestAlert(true);
                    return;
                }
                setSavingDraft(true);
                
                const partsDetailStr = parts.map(p => `${formatForSheet(p.name)} ${parseFloat(p.weight) || 0}g`).join(", ");
                const filamentsDetailStr = parts.map(p => {
                    const fil = db.filaments[p.filamentIndex] || {};
                    const colorDesc = p.selectedColors && p.selectedColors.length > 0 ? p.selectedColors.join(" & ") : fil.colour;
                    return `${formatForSheet(p.name)} ${formatForSheet(fil.type)} (${formatForSheet(fil.variant)}) ${formatForSheet(colorDesc)}`;
                }).join(", ");
                
                const platesDetailStr = plates.map((pl, i) => {
                    const plateNum = String(i + 1).padStart(2, '0');
                    const pList = pl.parts.filter(x => x.qty > 0).map(pref => {
                        const po = parts.find(x => x.id === pref.partId);
                        return `${po ? formatForSheet(po.name) : 'UNKNOWN'} x${pref.qty}`;
                    }).join(": ");
                    return `PLATE${plateNum} [${pl.hours || 0}h ${pl.minutes || 0}m] x${pl.qty} - ${pList}`;
                }).join(", ");

                const componentsDetailStr = selectedComponents.length > 0 ? selectedComponents.map(c => {
                    const compObj = db.components.find(x => x.id === c.compId);
                    return `${compObj ? formatForSheet(compObj.name) : 'UNKNOWN'} x${c.qty}`;
                }).join(", ") : "-";

                const totalHours = plates.reduce((acc, pl) => acc + (parseInt(pl.hours) || 0), 0);
                const totalMins = plates.reduce((acc, pl) => acc + (parseInt(pl.minutes) || 0), 0);
                
                const payload = {
                    userId: user.userId,
                    productName: formatForSheet(productName),
                    partsDetail: partsDetailStr,
                    filamentsDetail: filamentsDetailStr,
                    platesDetail: platesDetailStr,
                    componentsDetail: componentsDetailStr, 
                    timeHours: totalHours,
                    timeMinutes: totalMins,
                    totalPlates: totalPlatesCount,
                    totalMaterial: plateMaterialTotal,
                    totalComponents: componentsTotal,
                    totalPlateFee: totalPlateFee,
                    totalPrintTimeFee: totalPrintTimeFee,
                    sellingPricePerUnit: finalTotal,
                    orderQty: orderQty,
                    totalEstimatedPrice: finalTotal * orderQty
                };
                
                try {
                    await fetch(DRAFTS_API, { method: 'POST', body: JSON.stringify(payload) });
                    showToast("Draft saved successfully!");
                } catch (e) {
                    showToast("Error saving draft.");
                }
                setSavingDraft(false);
            };

            if (!user) {
                if (authScreenMode === 'otp') {
                    return (
                        <div className="min-h-screen bg-slate-900 flex items-center justify-center p-4 relative">
                            {toast && <div className="absolute top-4 right-4 bg-slate-800 border border-slate-700 shadow-xl text-white px-6 py-3 font-bold rounded-xl z-[200]">{toast}</div>}
                            <div className="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md">
                                <h2 className="text-2xl font-black text-slate-900 mb-2 text-center">Verification</h2>
                                <p className="text-sm text-slate-500 mb-6 text-center">Enter the 6-digit OTP sent to your WhatsApp</p>
                                <div className="flex gap-2 justify-center mb-6" onPaste={(e) => {
                                    e.preventDefault();
                                    const pasted = e.clipboardData.getData('text').replace(/\D/g, '').slice(0, 6);
                                    const newOtp = [...otp];
                                    for (let i = 0; i < pasted.length; i++) newOtp[i] = pasted[i];
                                    setOtp(newOtp);
                                    if(pasted.length > 0) otpRefs.current[Math.min(pasted.length - 1, 5)].focus();
                                }}>
                                    {otp.map((digit, i) => (
                                        <React.Fragment key={i}>
                                            <input 
                                                ref={el => otpRefs.current[i] = el}
                                                type="text" maxLength={1} value={digit}
                                                onChange={e => {
                                                    const val = e.target.value.replace(/\D/g, '');
                                                    if (val) {
                                                        const newOtp = [...otp];
                                                        newOtp[i] = val.substring(val.length - 1);
                                                        setOtp(newOtp);
                                                        if (i < 5) otpRefs.current[i + 1].focus();
                                                    }
                                                }}
                                                onKeyDown={e => {
                                                    if (e.key === 'Backspace' && !otp[i] && i > 0) otpRefs.current[i - 1].focus();
                                                }}
                                                className="w-10 h-12 text-center text-lg font-bold border-2 border-slate-200 rounded-lg focus:border-brand-500 focus:ring-0 outline-none"
                                            />
                                            {i === 2 && <div className="text-slate-400 font-bold self-center">-</div>}
                                        </React.Fragment>
                                    ))}
                                </div>
                                <button onClick={() => {
                                        setUser({ userId: tempUserId || "USR000", nickname: signupForm.nickname || "User" });
                                        showToast("Verified Successfully!");
                                    }} 
                                    disabled={otp.join('').length < 6} 
                                    className="w-full py-3 bg-brand-500 text-white font-bold rounded-xl disabled:opacity-50">
                                    Verify & Proceed
                                </button>
                            </div>
                        </div>
                    );
                }

                return (
                    <div className="min-h-screen bg-slate-900 flex items-center justify-center p-4 relative">
                        {toast && <div className="absolute top-4 right-4 bg-slate-800 border border-slate-700 shadow-xl text-white px-6 py-3 font-bold rounded-xl z-[200]">{toast}</div>}
                        <div className="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md max-h-[90vh] overflow-y-auto">
                            <div className="flex justify-center mb-4">
                                <img src="LOGO_RAKA-CHI.png" alt="RAKA-CHI" className="h-16 w-auto object-contain" onError={(e) => { e.target.style.display = 'none'; e.target.nextSibling.style.display = 'flex'; }} />
                                <div className="hidden w-12 h-12 bg-brand-500 rounded-xl items-center justify-center text-white font-black text-xl">R</div>
                            </div>
                            <h2 className="text-2xl font-black text-slate-900 mb-2 text-center">
                                {authScreenMode === 'login' ? 'Welcome Back' : 'Create Account'}
                            </h2>
                            <form onSubmit={authScreenMode === 'login' ? handleLoginSubmit : handleSignupSubmit} className="space-y-4 mt-6">
                                {authScreenMode === 'signup' && (
                                    <React.Fragment>
                                        <div className="grid grid-cols-2 gap-4">
                                            <div>
                                                <label className="text-xs font-bold text-slate-500 uppercase">Full Name</label>
                                                <input required value={signupForm.fullName} onChange={e=>setSignupForm({...signupForm, fullName: e.target.value})} className="w-full mt-1 px-3 py-2 border rounded-lg text-sm outline-none focus:border-brand-500" />
                                            </div>
                                            <div>
                                                <label className="text-xs font-bold text-slate-500 uppercase">Nickname</label>
                                                <input required value={signupForm.nickname} onChange={e=>setSignupForm({...signupForm, nickname: e.target.value})} className="w-full mt-1 px-3 py-2 border rounded-lg text-sm outline-none focus:border-brand-500" />
                                            </div>
                                        </div>
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                            <div>
                                                <label className="text-xs font-bold text-slate-500 uppercase">Month of Birth</label>
                                                <select required value={signupForm.monthOfBirth} onChange={e=>setSignupForm({...signupForm, monthOfBirth: e.target.value})} className="w-full mt-1 px-3 py-2 border rounded-lg text-sm bg-white outline-none focus:border-brand-500">
                                                    {["January","February","March","April","May","June","July","August","September","October","November","December"].map(m=><option key={m} value={m}>{m}</option>)}
                                                </select>
                                            </div>
                                            <div>
                                                <label className="text-xs font-bold text-slate-500 uppercase">Age Stage</label>
                                                <select required value={signupForm.ageStages} onChange={e=>setSignupForm({...signupForm, ageStages: e.target.value})} className="w-full mt-1 px-3 py-2 border rounded-lg text-[10px] font-medium bg-white h-[38px] truncate outline-none focus:border-brand-500">
                                                    {[
                                                        "Kanak-Kanak Prasekolah (Preschooler): 3 hingga 5 tahun",
                                                        "Kanak-Kanak Sekolah (School-aged Child): 6 hingga 9 tahun",
                                                        "Pra-Remaja (Tween): 10 hingga 12 tahun",
                                                        "Remaja (Teenager / Adolescent): 13 hingga 17 tahun",
                                                        "Belia / Dewasa Muda (Young Adult): 18 hingga 25 tahun",
                                                        "Dewasa (Adult): 26 hingga 39 tahun",
                                                        "Dewasa Pertengahan (Middle-Aged Adult): 40 hingga 59 tahun",
                                                        "Warga Emas (Senior / Senior Adult): 60 hingga 74 tahun",
                                                        "Warga Emas Peringkat Akhir (Elderly): 75 tahun ke atas"
                                                    ].map(a=><option key={a} value={a}>{a}</option>)}
                                                </select>
                                            </div>
                                        </div>

                                                            <div className="flex justify-between items-center mt-4 pt-3 border-t border-slate-200">
                                                                <label className="flex items-center gap-2 cursor-pointer bg-white border border-slate-200 px-3 py-1.5 rounded-lg hover:bg-slate-50 transition-colors">
                                                                    <input type="checkbox" checked={p.support} onChange={(e) => { const updated = [...parts]; updated[pIdx].support = e.target.checked; setParts(updated); }} className="w-4 h-4 text-brand-500 rounded focus:ring-0" />
                                                                    <span className="text-xs font-bold text-slate-700">With Support</span>
                                                                </label>
                                                                <button onClick={() => setParts(parts.filter(x => x.id !== p.id))} className="px-3 py-1.5 bg-red-50 text-red-600 hover:bg-red-100 rounded-lg text-xs font-bold transition">Delete</button>
                                                            </div>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {step === 3 && (
                                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                                        <div className="flex justify-between items-center mb-4">
                                            <h2 className="text-lg font-black text-slate-900">Plates Configuration</h2>
                                            <button onClick={() => setPlates([...plates, { id: Date.now(), qty: 1, hours: 0, minutes: 0, parts: parts.map(p => ({ partId: p.id, qty: 0 })) }])} className="px-3 py-1.5 bg-brand-500 text-white rounded-xl text-xs font-bold hover:bg-brand-600">+ Add Plate</button>
                                        </div>
                                        <div className="space-y-4">
                                            {plates.length === 0 ? <div className="text-center py-6 text-sm text-slate-400 font-medium bg-slate-50 border border-dashed rounded-xl">No plates created.</div> : plates.map((pl, plIdx) => (
                                                <div key={pl.id} className="p-4 bg-slate-50 rounded-xl border border-slate-200 space-y-4">
                                                    <div className="flex flex-wrap justify-between items-center gap-3 pb-3 border-b border-slate-200">
                                                        <h3 className="font-bold text-sm text-slate-800">Plate {String(plIdx + 1).padStart(2, '0')}</h3>
                                                        <div className="flex flex-wrap items-center gap-3">
                                                            <div className="flex items-center gap-1 bg-white border border-slate-200 px-2 py-1 rounded-lg">
                                                                <span className="text-[10px] font-bold text-slate-400 uppercase mr-1">Time:</span>
                                                                <input type="number" min="0" value={pl.hours} onChange={e => { const up = [...plates]; up[plIdx].hours = e.target.value === '' ? '' : parseInt(e.target.value); setPlates(up); }} className="w-10 text-center text-xs font-bold outline-none font-mono focus:border-brand-500" placeholder="H" />
                                                                <span className="text-xs text-slate-400 font-medium">h</span>
                                                                <input type="number" min="0" max="59" value={pl.minutes} onChange={e => { const up = [...plates]; up[plIdx].minutes = e.target.value === '' ? '' : parseInt(e.target.value); setPlates(up); }} className="w-10 text-center text-xs font-bold outline-none font-mono focus:border-brand-500" placeholder="M" />
                                                                <span className="text-xs text-slate-400 font-medium">m</span>
                                                            </div>
                                                            <div className="flex items-center gap-2">
                                                                <span className="text-xs font-bold text-slate-500 uppercase">Qty</span>
                                                                <input type="number" min="1" value={pl.qty} onChange={e => { const updated = [...plates]; updated[plIdx].qty = e.target.value; setPlates(updated); }} className="w-16 px-2 py-1 bg-white border border-slate-200 rounded text-sm text-center font-bold focus:border-brand-500 outline-none" />
                                                            </div>
                                                            <button onClick={() => setPlates(plates.filter(x => x.id !== pl.id))} className="text-red-500 font-bold text-xs bg-red-50 px-2 py-1 rounded hover:bg-red-100">Remove</button>
                                                        </div>
                                                    </div>
                                                    <div className="grid grid-cols-2 md:grid-cols-3 gap-3">
                                                        {pl.parts.map((pref, prIdx) => {
                                                            const part = parts.find(p => p.id === pref.partId);
                                                            if (!part) return null;
                                                            return (
                                                                <div key={pref.partId} className="bg-white p-2 rounded-lg border border-slate-200 flex justify-between items-center">
                                                                    <span className="text-[10px] font-bold truncate max-w-[80px] text-slate-700" title={part.name}>{part.name || "UNNAMED"}</span>
                                                                    <div className="flex items-center gap-1">
                                                                        <button onClick={() => { const up = [...plates]; if(up[plIdx].parts[prIdx].qty > 0) up[plIdx].parts[prIdx].qty--; setPlates(up); }} className="w-5 h-5 bg-slate-100 hover:bg-slate-200 rounded text-slate-600 font-bold flex items-center justify-center transition">-</button>
                                                                        <span className="text-xs font-mono font-bold w-4 text-center">{pref.qty}</span>
                                                                        <button onClick={() => { const up = [...plates]; up[plIdx].parts[prIdx].qty++; setPlates(up); }} className="w-5 h-5 bg-slate-100 hover:bg-slate-200 rounded text-slate-600 font-bold flex items-center justify-center transition">+</button>
                                                                    </div>
                                                                </div>
                                                            )
                                                        })}
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                {step === 4 && (
                                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                                        <h2 className="text-lg font-black text-slate-900 mb-4">Additional Components</h2>
                                        <div className="space-y-2">
                                            {db.components.filter(c => c.category !== 'SERVICES').map(c => {
                                                const sel = selectedComponents.find(x => x.compId === c.id);
                                                const qty = sel ? sel.qty : 0;
                                                return (
                                                    <div key={c.id} className="flex justify-between items-center p-3 bg-slate-50 border border-slate-200 rounded-xl hover:border-slate-300 transition-colors">
                                                        <div>
                                                            <div className="font-bold text-sm text-slate-800">{c.name}</div>
                                                            <div className="text-[10px] text-brand-600 font-bold font-mono">RM {c.price.toFixed(2)}/unit</div>
                                                        </div>
                                                        <div className="flex items-center gap-2">
                                                            <button onClick={() => { 
                                                                let up = [...selectedComponents];
                                                                if(qty > 1) { up.find(x => x.compId === c.id).qty--; } 
                                                                else { up = up.filter(x => x.compId !== c.id); }
                                                                setSelectedComponents(up);
                                                            }} className="w-8 h-8 bg-white border border-slate-200 shadow-sm rounded-lg text-slate-600 font-bold flex items-center justify-center hover:bg-slate-50">-</button>
                                                            <span className="text-sm font-mono font-bold w-6 text-center">{qty}</span>
                                                            <button onClick={() => { 
                                                                let up = [...selectedComponents];
                                                                if(qty > 0) { up.find(x => x.compId === c.id).qty++; } 
                                                                else { up.push({ compId: c.id, price: c.price, qty: 1 }); }
                                                                setSelectedComponents(up);
                                                            }} className="w-8 h-8 bg-white border border-slate-200 shadow-sm rounded-lg text-slate-600 font-bold flex items-center justify-center hover:bg-slate-50">+</button>
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                )}

                                {step === 5 && (
                                    <div className="space-y-4">
                                        <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                                            <h2 className="text-2xl font-black text-slate-900 uppercase">{productName || "UNTITLED PRODUCT"}</h2>
                                            <div className="mt-6 space-y-4">
                                                <div>
                                                    <h4 className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Plates summary</h4>
                                                    <div className="space-y-2">
                                                        {calculatedPlates.map((pl, i) => (
                                                            <div key={pl.id} className="p-3 bg-slate-50 rounded-xl border border-slate-100 flex justify-between items-center">
                                                                <div>
                                                                    <div className="flex items-center gap-2 flex-wrap">
                                                                        <span className="font-bold text-slate-800 text-sm">Plate {String(i+1).padStart(2, '0')}</span>
                                                                        <span className="text-xs font-bold text-brand-600 bg-brand-100 px-1.5 py-0.5 rounded">x{pl.qty}</span>
                                                                        <span className="text-xs font-medium text-slate-500">⏱️ {pl.hours || 0}h {pl.minutes || 0}m</span>
                                                                        <span className={`text-[10px] font-bold px-1.5 py-0.5 rounded ${pl.isPlateMulti ? 'bg-purple-100 text-purple-700' : 'bg-blue-100 text-blue-700'}`}>{pl.isPlateMulti ? '[MULTI]' : '[MONO]'}</span>
                                                                        <span className={`text-[10px] font-bold px-1.5 py-0.5 rounded ${pl.isPlateSupport ? 'bg-orange-100 text-orange-700' : 'bg-emerald-100 text-emerald-700'}`}>{pl.isPlateSupport ? '[SUPPORT]' : '[NO SUP]'}</span>
                                                                    </div>
                                                                    <div className="text-[10px] text-slate-500 mt-1">
                                                                        {pl.detailedParts && pl.detailedParts.filter(dp=>dp.qty>0).map(dp => 
                                                                            `${dp.name} (x${dp.qty} - ${dp.weight}g @ RM${dp.rate.toFixed(2)}/g)`
                                                                        ).join(', ')}
                                                                    </div>
                                                                </div>
                                                                <div className="text-right">
                                                                    <div className="font-mono text-sm font-bold text-slate-700">RM {pl.materialCost.toFixed(2)}</div>
                                                                </div>
                                                            </div>
                                                        ))}
                                                    </div>
                                                </div>

                                                <div className="mt-6">
                                                    <h4 className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Component summary</h4>
                                                    <div className="space-y-2">
                                                        {selectedComponents.length === 0 ? (
                                                            <div className="p-3 bg-slate-50 rounded-xl border border-slate-100 text-xs text-slate-400 italic">No additional components added.</div>
                                                        ) : selectedComponents.map((c, i) => {
                                                            const compObj = db.components.find(x => x.id === c.compId);
                                                            if (!compObj) return null;
                                                            return (
                                                                <div key={i} className="p-3 bg-slate-50 rounded-xl border border-slate-100 flex justify-between items-center">
                                                                    <div>
                                                                        <span className="font-bold text-slate-800 text-sm">{compObj.name}</span>
                                                                        <span className="text-xs font-bold text-brand-600 bg-brand-100 px-1.5 py-0.5 rounded ml-2">x{c.qty}</span>
                                                                        <div className="text-[10px] text-slate-500 mt-1">@ RM {c.price.toFixed(2)}/unit</div>
                                                                    </div>
                                                                    <div className="text-right">
                                                                        <div className="font-mono text-sm font-bold text-slate-700">RM {(c.qty * c.price).toFixed(2)}</div>
                                                                    </div>
                                                                </div>
                                                            );
                                                        })}
                                                    </div>
                                                </div>
                                                
                                                <div className="border-t border-slate-100 pt-4 space-y-2 text-sm mt-6">
                                                    <div className="flex justify-between text-slate-600"><span className="font-medium">Total Material</span><span className="font-mono font-bold">RM {plateMaterialTotal.toFixed(2)}</span></div>
                                                    <div className="flex justify-between text-slate-600"><span className="font-medium">Total Components</span><span className="font-mono font-bold">RM {componentsTotal.toFixed(2)}</span></div>
                                                    <div className="flex justify-between text-slate-600">
                                                        <span className="font-medium flex flex-col">
                                                            <span>Total Plate Fee</span>
                                                            <span className="text-[10px] text-slate-400">{totalPlatesCount} plates @ RM {plateFeeRate.toFixed(2)}/plate</span>
                                                        </span>
                                                        <span className="font-mono font-bold">RM {totalPlateFee.toFixed(2)}</span>
                                                    </div>
                                                    <div className="flex justify-between text-slate-600"><span className="font-medium">Total Print Time Fee</span><span className="font-mono font-bold">RM {totalPrintTimeFee.toFixed(2)}</span></div>
                                                    
                                                    <div className="flex justify-between text-lg pt-2 border-t border-slate-100"><span className="font-black text-slate-900">Selling Price / Unit</span><span className="font-mono font-black text-brand-600">RM {finalTotal.toFixed(2)}</span></div>
                                                </div>
                                            </div>
                                        </div>
                                        <div className="bg-slate-900 p-6 rounded-2xl shadow-xl text-white relative overflow-hidden">
                                            <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-brand-400 to-brand-600"></div>
                                            <div className="flex justify-between items-center mb-4">
                                                <span className="font-bold text-slate-300">Order Quantity</span>
                                                <input type="number" min="1" value={orderQty} onChange={e => setOrderQty(parseInt(e.target.value)||1)} className="w-20 px-3 py-2 bg-slate-800 border border-slate-700 rounded-xl text-center font-bold text-lg focus:outline-none focus:border-brand-500" />
                                            </div>
                                            <div className="flex justify-between items-center text-xl pt-4 border-t border-slate-800">
                                                <span className="font-black text-slate-400">Total Estimation</span>
                                                <span className="font-mono font-black text-white">RM {(finalTotal * orderQty).toFixed(2)}</span>
                                            </div>
                                            <button onClick={handleSaveQuotation} disabled={savingDraft} className="w-full mt-6 py-4 bg-brand-500 hover:bg-brand-400 transition text-white font-black rounded-xl text-lg disabled:opacity-50">
                                                {savingDraft ? 'Saving Draft...' : 'Save Quotation'}
                                            </button>
                                        </div>
                                    </div>
                                )}
                            </React.Fragment>
                        )}
                    </div>
                    
                    {!loadingDb && (
                        <div className="fixed bottom-0 left-0 right-0 p-4 bg-white/80 backdrop-blur-md border-t border-slate-200 flex justify-between gap-4 max-w-3xl mx-auto z-40">
                            <button onClick={() => setStep(step - 1)} disabled={step === 1} className="px-6 py-3 font-bold text-slate-500 bg-slate-100 rounded-xl disabled:opacity-30 transition">Back</button>
                            {step < 5 && <button onClick={() => { if(step === 1 && user === 'GUEST') setShowGuestAlert(true); else setStep(step + 1); }} className="flex-1 py-3 font-black text-white bg-slate-900 rounded-xl transition hover:bg-slate-800">Next</button>}
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
